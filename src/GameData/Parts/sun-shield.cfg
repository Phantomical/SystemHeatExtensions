+PART[strl-shl-sun01]:FIRST
{
    %name = active-heatshield-sun01
    %author = #$author$, steamroller
    %title = Active Super Heavy Shield

    %maxTemp = 2700
    %skinMaxTemp = 2700

    !MODULE,* {}

    %MODULE[ModuleSystemHeat]
    {
        %name = ModuleSystemHeat
        // Assume 1cm thickness and 78.54 m^2 surface area * 2
        %volume = #$../refArea10$
        @volume *= 0.02
    }

    %MODULE[ModuleActiveHeatCollector]
    {
        %name = ModuleActiveHeatCollector
        %moduleID = heatShield
        // Assume that the heat shield is made of tungsten and the pipe walls
        // are 2mm thick. This gets us
        //  
        //  173 W/(m*K) / 0.02m = 8650 W/(m^2*K)
        %thermalConductivity = 8.65

        %surfaceArea = #$../refArea10$
    }
}

