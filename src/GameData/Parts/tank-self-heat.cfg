
@PART:HAS[@RESOURCE[LqdHydrogen]]
{
    %MODULE[ModuleSystemHeat]
    {
        &name = ModuleSystemHeat
        &volume = 100
    }

    MODULE
    {
        name = ModuleSHXThermalDecay

        moduleID = thermal-leak

        RESOURCE
        {
            name = LqdHydrogen

            // The temperature that the heat flux is emitted at.
            temperature = 1000

            // Heat flux emitted passively by the resource itself, without any
            // decay involved.
            // 324 kW/t
            resourceFlux = 324

            // The rate at which the resource decays into heat.
            // 1%/hr
            decayRate = 1.0

            // The amount of heat flux emitted when the resource decays.
            // 1000 kW/t
            decayFlux = 1000

            // If true, the heat values are kW/t instead of kW/unit
            fluxByMass = true
        }
    }
}
