
@PART[strl-tectrb-*]:FOR[SystemHeatExpansion]:NEEDS[CommunityResourcePack]
{
    !MODULE[ModuleSystemHeat]:HAS[#moduleID[isru]] {}
    !MODULE[ModuleSystemHeatConverter]:HAS[#systemHeatModuleID[isru]] {}

    MODULE
    {
        name = ModuleSystemHeat
        volume = #$/refVolume$
        @volume *= 0.04

        iconName = Icon_Exhanger
        moduleID = inlet
        currentLoopId = 0
    }

    +MODULE[ModuleSystemHeat]:HAS[#moduleID[inlet]]
    {
        @moduleID = outlet
        @currentLoopId = 1
    }

    MODULE
    {
        name = ModuleSHXHeatEngine
        moduleID = HeatEngine

        systemHeatModuleID1 = inlet
        systemHeatModuleID2 = outlet

        // This converter gets 50% of the carnot efficiency.
        //
        // This determines how much work is extracted by the generator and
        // turned into usable resources.
        efficiency = 0.5

        heatRate = 2400
        @heatRate *= #$/refPower$

        RESOURCE
        {
            name = ElectricCharge
            // How much EC is generated for each KJ of work done by the generator.
            rate = 1.0
            flowMode = ALL_VESSEL
        }
    }
}
