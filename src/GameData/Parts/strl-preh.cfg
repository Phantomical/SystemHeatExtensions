
@PART[strl-preh-*]:FOR[SystemHeatExpansion]:NEEDS[CommunityResourcePack]
{
    !MODULE[ModuleSystemHeatConverter]:HAS[#moduleID[Heating]] {}

    MODULE
    {
        name = ModuleSHXHeatGenerator
        moduleID = Heating
        systemHeatModuleID = heater1

        systemPower = #$/refPower$
        @systemPower *= 1000
        targetTemperature = 650

        RESOURCE
        {
            name = ThermalPower
            rate = #$/refPower$
            flowMode = STAGE_PRIORITY_FLOW
        }
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[shutdownTemperature]]
    {
        @SUBTYPE:HAS[@MODULE:HAS[@IDENTIFIER[ModuleSystemHeatConverter]]]
        {
            @MODULE:HAS[@IDENTIFIER[ModuleSystemHeatConverter]]
            {
                @IDENTIFIER
                {
                    @name = ModuleSHXHeatGenerator
                }
                @DATA
                {
                    %targetTemperature = #$systemOutletTemperature$
                    !systemOutletTemperature = delete
                    !shutdownTemperature = delete
                }
            }
        }
    }
}
