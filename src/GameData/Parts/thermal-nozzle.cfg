
+PART[SSME]:FOR[SystemHeatExtensions]
{
    %name = active-heatshields-ssme
    %title = AH-125 "Blowtorch" Thermal Nozzle
    %manufacturer = Self-Propelled BBQ Products Inc.
    %description = Heat your fuel up and chuck it out the back! The hotter things get the faster you'll go.

    @MODULE[ModuleEnginesFX]
    {
        @name = ModuleThermalEngine

        moduleID = #$engineID$

        maxEngineTemp = 3000
        minOperatingTemp = 500

        !atmosphereCurve {}

        atmosphereCurve
        {
            key = 0 1
            key = 1 1
        }
        
        temperatureIspCurve
        {
            key = 1000 1000
            key = 3000 3000
        }


        !PROPELLANT,* {}

        PROPELLANT
        {
            name = LqdHydrogen
            ratio = 1.0
            DrawGauge = true

            // Start off at 20K
            temperature = 20

            // The specific heat capacity varies by temperature and pressure.
            // We need to pick one value here, somewhat arbitrarily.
            //
            //  15 J/kg/K = 15 kJ/t/K
            specificHeatCapacity = 15

            // Hydrogen has a latent heat of evaporation of
            //
            //  461 kJ/kg = 0.461 kJ/t
            vaporizationCost = 0.461
        }
    }

    MODULE
    {
        name = ModuleSystemHeat
        volume = 1.0
    }

}
