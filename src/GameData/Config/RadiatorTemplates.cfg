@PART:HAS[@MODULE[ModuleSHXOpenCycleRadiator]:HAS[#coolantTemplate[LqdHydrogen]]]:FOR[SystemHeatExpansion]
{
  @MODULE[ModuleSHXOpenCycleRadiator]:HAS[#coolantTemplate[LqdHydrogen]]
  {
    !coolantTemplate = delete
    &coolantName = LqdHydrogen
    
    // What temperature is the coolant?
    //
    // Hydrogen is liquid between 14K and 20.3K, so this is a value on the
    // colder side which means it is a little bit more effective.
    &coolantTemperature = 15
    
    // How much energy does it take to vaporize the coolant?
    //
    // 0.904 kJ/mol * 495 mol/kg = 447.41 kJ/kg -> 447480 kJ/t
    &coolantVaporizationCost = 447480
    
    // How much energy per degree does it take, on average, to raise the
    // coolant temperature to the specified exhaust temperature?
    &coolantSpecificHeatCapacityCurve
    {
      // 12 kJ/kg -> 12000 kJ/t
      key = 0     12000
      key = 175   13120
      key = 1000  14980
      key = 1500  16020
      key = 2000  17010
      key = 3000  18390
      key = 6000  20960
    }
  }
}

